name: release

on:
  push:
    branches: [main]
    paths:
      - '*/maestria-plugin.json'
      - 'external.json'
      - 'scripts/release.mjs'
  schedule:
    # os plugins de fora mudam sem passar por aqui: o catálogo os relê todo dia
    - cron: '0 9 * * *'
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
